<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description"><title id="title">Промбезопасность для ИТР</title><desc id="description">Оригинальная редакционная схема OT Center. Как определить программу и срок следующей проверки.</desc><rect x="0" y="0" width="1536" height="1024" rx="0" fill="#f5f5f0" stroke="none" stroke-width="3"/><rect x="0" y="0" width="26" height="1024" rx="0" fill="#236a6b" stroke="none" stroke-width="3"/><text x="103" y="146" fill="#10262a" font-family="Arial, sans-serif" font-size="45" font-weight="700" text-anchor="start">OT Center</text><text x="1427" y="144" fill="#526b6b" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="end">Практика безопасной работы</text><path d="M104 191L1427 191" fill="none" stroke="#baccc4" stroke-width="2" stroke-linecap="round"/><text x="103" y="382" fill="#10262a" font-family="Arial, sans-serif" font-size="53" font-weight="700" text-anchor="start">Промбезопасность</text><text x="103" y="455" fill="#10262a" font-family="Arial, sans-serif" font-size="53" font-weight="700" text-anchor="start">для ИТР</text><text x="107" y="550" fill="#526b6b" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">Как определить программу</text><text x="107" y="598" fill="#526b6b" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">и срок следующей проверки</text><rect x="107" y="649" width="91" height="6" rx="0" fill="#236a6b" stroke="none" stroke-width="3"/><text x="107" y="723" fill="#236a6b" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Функции</text><text x="107" y="768" fill="#236a6b" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">программа • срок</text><rect x="849" y="271" width="509" height="502" rx="12" fill="#ffffff" stroke="#baccc4" stroke-width="3"/><rect x="849" y="271" width="5