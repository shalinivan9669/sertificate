<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title description"><title id="title">Группа по электробезопасности</title><desc id="description">Оригинальная редакционная схема OT Center. Какие сведения и документы подготовить работодателю.</desc><rect x="0" y="0" width="1536" height="1024" rx="0" fill="#f5f5f0" stroke="none" stroke-width="3"/><rect x="0" y="0" width="26" height="1024" rx="0" fill="#236a6b" stroke="none" stroke-width="3"/><text x="103" y="146" fill="#10262a" font-family="Arial, sans-serif" font-size="45" font-weight="700" text-anchor="start">OT Center</text><text x="1427" y="144" fill="#526b6b" font-family="Arial, sans-serif" font-size="27" font-weight="400" text-anchor="end">Практика безопасной работы</text><path d="M104 191L1427 191" fill="none" stroke="#baccc4" stroke-width="2" stroke-linecap="round"/><text x="103" y="382" fill="#10262a" font-family="Arial, sans-serif" font-size="53" font-weight="700" text-anchor="start">Группа по</text><text x="103" y="455" fill="#10262a" font-family="Arial, sans-serif" font-size="53" font-weight="700" text-anchor="start">электробезопасности</text><text x="107" y="550" fill="#526b6b" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">Какие сведения и документы</text><text x="107" y="598" fill="#526b6b" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">подготовить работодателю</text><rect x="107" y="649" width="91" height="6" rx="0" fill="#236a6b" stroke="none" stroke-width="3"/><text x="107" y="723" fill="#236a6b" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Обязанности</text><text x="107" y="768" fill="#236a6b" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start">знания • подтверждение</text><text x="852" y="310" fill="#10262a" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start">Группы I–V</text><rect x="850" y="356" width="92" height="96" rx="12" fill="#dde8e1" stroke="none" stroke-width="3"/><text x="896" y="420" fill="#10262a" font-family="Arial, sans-serif" font-size="41" font-weight="700" text-anchor="middle">I</text><rect x="956" y="356" width="92" height="96" rx="12" fill="#dde8e1" stroke="none" stroke-width="3"/><text x="1002" y="420" fill="#10262a" font-family="Arial, sans-serif" font-size="41" font-weight="700" text-anchor="middle">II</text><rect x="1062" y="356" width="92" height="96" rx="12" fill="#236a6b" stroke="none" stroke-width="3"/><text x="1108" y="420" fill="#ffffff" font-family="Arial, sans-serif" font-size="41" font-weight="700" text-anchor="middle">III</text><rect x="1168" y="356" width="92" height="96" rx="12" fill="#dde8e1" stroke="none" stroke-width="3"/><text x="1214" y="420" fill="#10262a" font-family="Arial, sans-serif" font-size="41" font-weight="700" text-anchor="middle">IV</text><rect x="1274" y="356" width="92" height="96" rx="12" fill="#dde8e1" stroke="none" stroke-width="3"/><text x="1320" y="420" fill="#10262a" font-family="Arial, sans-serif" font-size="41" font-weight="700" text-anchor="middle">V</text><path d="M1108 474L1108 514" fill="none" stroke="#236a6b" stroke-width="4" stroke-linecap="round"/><rect x="849" y="523" width="522" height="226" rx="12" fill="#ffffff" stroke="#baccc4" stroke-width="3"/><circle cx="897" cy="570" r="22" fill="#236a6b" stroke="none" stroke-width="3"/><text x="897" y="580" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">1</text><text x="941" y="581" fill="#10262a" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start">Обязанности и установки</text><circle cx="897" cy="638" r="22" fill="#236a6b" stroke="none" stroke-width="3"/><text x="897" y="648" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">2</text><text x="941" y="649" fill="#1